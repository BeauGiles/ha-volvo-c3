name: Feature request
description: Something the Volvo Cars app does that Volvo C3 doesn't.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like?
      description: Where it is in the Volvo Cars app, and what you would use it for in Home Assistant.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Car model and year
      placeholder: XC40 Recharge 2023
